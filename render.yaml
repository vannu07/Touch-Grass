services:
  - type: web
    name: last-light
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt -r requirements-ml.txt
    startCommand: uvicorn lastlight.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
