[project]
name = "last-light"
version = "1.0.0"
description = "A local-first dusk walk ticket for getting outside."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "python-multipart>=0.0.9"
]

[tool.vercel]
entrypoint = "api.index:app"
